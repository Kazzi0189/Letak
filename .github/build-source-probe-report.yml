name: Build source probe report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build report
        run: node scripts/build-source-probe-report.mjs

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/source-probe/report.md data/source-probe/report.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build source probe report"
            git push
          fi
