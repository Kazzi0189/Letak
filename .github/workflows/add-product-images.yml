name: Add product images to app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch product image display
        run: node scripts/patch-product-images.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/combine-offers.mjs

      - name: Rebuild combined offers
        run: node scripts/combine-offers.mjs

      - name: Commit product image display
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app.js styles.css scripts/combine-offers.mjs scripts/patch-product-images.mjs data/offers.json data/offers-combined-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add product images to offers"
            git push
          fi
