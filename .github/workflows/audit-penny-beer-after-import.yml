name: Audit Penny beer after import

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/audit-penny-beer-after-import.mjs

      - name: Audit Penny beer after import
        run: node scripts/audit-penny-beer-after-import.mjs

      - name: Commit Penny beer after import audit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/audit-penny-beer-after-import.mjs data/penny-probe/penny-beer-after-import-audit-summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Audit Penny beer after import"
            git push
          fi
