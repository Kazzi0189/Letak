name: Audit Penny noise v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/audit-penny-noise-v1.mjs

      - name: Audit Penny noise v1
        run: node scripts/audit-penny-noise-v1.mjs

      - name: Commit Penny noise audit v1
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/audit-penny-noise-v1.mjs data/penny-probe/penny-noise-audit-v1-summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Audit Penny noise v1"
            git push
          fi
