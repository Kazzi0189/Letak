name: Clean Penny hidden HTML candidates v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/clean-penny-hidden-html-candidates-v2.mjs

      - name: Clean Penny hidden HTML candidates v2
        run: node scripts/clean-penny-hidden-html-candidates-v2.mjs

      - name: Commit Penny hidden HTML clean candidates v2
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/clean-penny-hidden-html-candidates-v2.mjs data/penny-probe/penny-hidden-html-clean-candidates-v2.json data/penny-probe/penny-hidden-html-clean-candidates-v2-summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean Penny hidden HTML candidates v2"
            git push
          fi
