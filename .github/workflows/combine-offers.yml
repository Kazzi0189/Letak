name: Combine offers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Combine offers
        run: node scripts/combine-offers.mjs

      - name: Commit combined offers
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/offers.json data/offers-penny-last.json data/offers-combined-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Combine offers"
            git push
          fi
