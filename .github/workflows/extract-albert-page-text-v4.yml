name: Extract Albert page text v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract Albert hidden page text v4
        run: node scripts/extract-albert-page-text-v4.mjs

      - name: Check JavaScript syntax
        run: node --check scripts/extract-albert-page-text-v4.mjs

      - name: Commit Albert hidden page text v4
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/extract-albert-page-text-v4.mjs data/albert-probe/page-text-v4-summary.json data/albert-probe/albert-page-text-v4-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Albert hidden page text v4"
            git push
          fi
