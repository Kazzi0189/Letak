name: Extract Albert PDF offers v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract Albert PDF offers v2
        run: node scripts/extract-albert-pdf-offers-v2.mjs

      - name: Check JavaScript syntax
        run: node --check scripts/extract-albert-pdf-offers-v2.mjs

      - name: Commit Albert PDF offers v2
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/extract-albert-pdf-offers-v2.mjs data/albert-pdf-offers.json data/albert-probe/pdf-offers-v2-summary.json data/albert-probe/albert-pdf-offers-v2-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Albert PDF offers v2"
            git push
          fi
