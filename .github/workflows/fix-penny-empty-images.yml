name: Fix Penny empty images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fix Penny empty image boxes
        run: node scripts/fix-penny-empty-images.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/import-penny-leaflet-html.mjs

      - name: Rebuild Penny offers
        run: node scripts/import-penny-leaflet-html.mjs

      - name: Rebuild combined offers
        run: node scripts/combine-offers.mjs

      - name: Commit Penny image fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app.js styles.css scripts/import-penny-leaflet-html.mjs scripts/fix-penny-empty-images.mjs data/penny-leaflet-offers.json data/penny-leaflet-html-debug.json data/offers.json data/offers-combined-debug.json data/product-image-probe/penny-page-image-candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix empty Penny image boxes"
            git push
          fi
