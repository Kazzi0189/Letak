name: Import Albert and combine offers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Check scripts syntax
        run: |
          node --check scripts/extract-albert-pdf-offers-v7.mjs
          node --check scripts/combine-offers.mjs
          node --check scripts/patch-app-albert.mjs

      - name: Import Albert PDF offers v7 clean
        run: node scripts/extract-albert-pdf-offers-v7.mjs

      - name: Combine all offers
        run: node scripts/combine-offers.mjs

      - name: Patch app for Albert stores
        run: node scripts/patch-app-albert.mjs

      - name: Validate combined offers
        run: node scripts/validate-offers.mjs

      - name: Commit Albert combined offers
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/extract-albert-pdf-offers-v7.mjs scripts/combine-offers.mjs scripts/patch-app-albert.mjs
          git add data/albert-pdf-offers.json data/albert-pdf-offers-clean.json data/offers.json data/offers-combined-debug.json
          git add data/albert-probe/pdf-offers-v7-summary.json data/albert-probe/albert-pdf-offers-v7-debug.json
          git add app.js

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Albert and combine offers"
            git push
          fi
