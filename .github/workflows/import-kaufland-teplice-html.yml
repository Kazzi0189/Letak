name: Import Kaufland Teplice HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import Kaufland Teplice from HTML
        run: node scripts/import-kaufland-teplice-html.mjs

      - name: Commit Kaufland HTML import results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/kaufland-html-import data/offers-kaufland-teplice.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Kaufland Teplice offers from HTML"
            git push
          fi
