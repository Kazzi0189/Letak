name: Import probe Kaufland Teplice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import/probe Kaufland Teplice
        run: node scripts/import-kaufland-teplice.mjs

      - name: Commit Kaufland import probe results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/kaufland-import

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import probe Kaufland Teplice"
            git push
          fi
