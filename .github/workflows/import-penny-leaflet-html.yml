name: Import Penny leaflet HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import Penny leaflet HTML
        run: node scripts/import-penny-leaflet-html.mjs

      - name: Commit Penny leaflet HTML import
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/penny-leaflet-offers.json data/penny-leaflet-html-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Penny leaflet offers from HTML"
            git push
          fi
