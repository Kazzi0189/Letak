name: Manual tools

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Vyber nástroj"
        required: true
        type: choice
        default: "combine-offers"
        options:
          - combine-offers
          - import-kaufland-teplice
          - probe-penny-leaflet
          - probe-penny-viewer-deep
          - patch-app-kaufland-teplice
          - custom-script
      custom_script:
        description: "Pouze pro custom-script, například scripts/moje-kontrola.mjs"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run selected tool
        env:
          TOOL_NAME: ${{ inputs.tool }}
          CUSTOM_SCRIPT: ${{ inputs.custom_script }}
        run: node scripts/manual-tool-runner.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          case "${{ inputs.tool }}" in
            combine-offers)
              git add data/offers.json data/offers-penny-last.json data/offers-combined-debug.json
              ;;
            import-kaufland-teplice)
              git add data/kaufland-html-import data/offers-kaufland-teplice.json
              ;;
            probe-penny-leaflet)
              git add data/penny-leaflet-probe
              ;;
            probe-penny-viewer-deep)
              git add data/penny-viewer-deep-probe
              ;;
            patch-app-kaufland-teplice)
              git add app.js
              ;;
            custom-script)
              git add data app.js || true
              ;;
          esac

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Run manual tool: ${{ inputs.tool }}"
            git push
          fi
