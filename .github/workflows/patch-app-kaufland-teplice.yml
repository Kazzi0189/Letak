name: Patch app Kaufland Teplice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch app.js
        run: node scripts/patch-app-kaufland-teplice.mjs

      - name: Commit app.js patch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app.js

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Enable Kaufland Teplice store in app"
            git push
          fi
