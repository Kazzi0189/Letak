name: Patch offer quality filter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch app quality filter
        run: node scripts/patch-offer-quality-filter.mjs

      - name: Rebuild combined offers
        run: node scripts/combine-offers.mjs

      - name: Commit quality filter changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add app.js styles.css scripts/combine-offers.mjs data/offers.json data/offers-penny-last.json data/offers-combined-debug.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add offer quality filter"
            git push
          fi
