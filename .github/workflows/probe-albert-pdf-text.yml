name: Probe Albert PDF text

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Probe Albert PDF text
        run: node scripts/probe-albert-pdf-text.mjs

      - name: Check JavaScript syntax
        run: node --check scripts/probe-albert-pdf-text.mjs

      - name: Commit Albert PDF text probe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/probe-albert-pdf-text.mjs data/albert-probe/pdf-text-summary.json data/albert-probe/albert-pdf-text-debug.json data/albert-probe/pdf/*.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Albert PDF text"
            git push
          fi
