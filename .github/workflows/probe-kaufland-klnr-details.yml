name: Probe Kaufland klNr details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Kaufland klNr details
        run: node scripts/probe-kaufland-klnr-details.mjs

      - name: Commit Kaufland klNr detail probe results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/kaufland-detail-probe

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Kaufland klNr details"
            git push
          fi
