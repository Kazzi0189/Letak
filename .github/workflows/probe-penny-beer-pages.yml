name: Probe Penny beer pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Penny beer pages
        run: node scripts/probe-penny-beer-pages.mjs

      - name: Check JavaScript syntax
        run: node --check scripts/probe-penny-beer-pages.mjs

      - name: Commit Penny beer page probe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/probe-penny-beer-pages.mjs data/penny-probe/penny-beer-page-probe-summary.json data/penny-probe/penny-page-*-visible.txt data/penny-probe/penny-page-*-raw.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny beer pages"
            git push
          fi
