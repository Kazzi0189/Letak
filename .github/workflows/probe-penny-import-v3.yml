name: Probe Penny import V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/probe-penny-import-v3.mjs

      - name: Probe Penny import V3
        run: node scripts/probe-penny-import-v3.mjs

      - name: Commit Penny import V3 probe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/probe-penny-import-v3.mjs data/penny-probe/penny-import-v3-probe-summary.json data/penny-probe/penny-import-v3-probe-candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny import V3"
            git push
          fi
