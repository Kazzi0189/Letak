name: Probe Penny KC images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Penny KC images
        run: node scripts/probe-penny-kc-images.mjs

      - name: Commit Penny KC image probe
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/product-image-probe/penny-kc-image-candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny KC images"
            git push
          fi
