name: Probe Penny page20 beer offers v4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/probe-penny-page20-beer-offers-v4.mjs

      - name: Probe Penny page20 beer offers v4
        run: node scripts/probe-penny-page20-beer-offers-v4.mjs

      - name: Commit Penny page20 beer offers v4
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/probe-penny-page20-beer-offers-v4.mjs data/penny-probe/penny-page20-beer-offers-v4.json data/penny-probe/penny-page20-beer-offers-v4-summary.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny page20 beer offers v4"
            git push
          fi
