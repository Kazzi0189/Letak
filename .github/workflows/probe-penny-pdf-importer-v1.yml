name: Probe Penny PDF importer v1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: node --check scripts/probe-penny-pdf-importer-v1.mjs

      - name: Probe Penny PDF importer v1
        run: node scripts/probe-penny-pdf-importer-v1.mjs

      - name: Commit Penny PDF importer probe v1
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add scripts/probe-penny-pdf-importer-v1.mjs data/penny-probe/penny-pdf-importer-probe-v1-summary.json data/penny-probe/penny-pdf-importer-probe-v1-candidates.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny PDF importer v1"
            git push
          fi
