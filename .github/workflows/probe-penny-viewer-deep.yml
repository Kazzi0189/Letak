name: Probe Penny viewer deep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Penny viewer deep
        run: node scripts/probe-penny-viewer-deep.mjs

      - name: Commit Penny viewer deep probe results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/penny-viewer-deep-probe

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe Penny viewer deep"
            git push
          fi
