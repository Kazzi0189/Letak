name: Probe product images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe product images
        run: node scripts/probe-product-images.mjs

      - name: Commit product image probe results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/product-image-probe

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Probe product images"
            git push
          fi
